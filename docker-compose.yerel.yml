# BİLGİSAYARDA DENEME KURULUMU (alan adı, SSL, gerçek SMS gerekmez)
# Kullanım:  docker compose -f docker-compose.yerel.yml up -d --build
# Açılacak adresler:
#   Oda / firma paneli : http://localhost:3000
#   Kurye uygulaması   : http://localhost:5173
# Durdurmak: docker compose -f docker-compose.yerel.yml down      (verileri silmek için sonuna -v ekleyin)
name: dagitim-yerel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dagitim
      POSTGRES_PASSWORD: dagitim-yerel
      POSTGRES_DB: dagitim
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagitim"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_REALTIME_URL: http://localhost:3001
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_KURYE_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dagitim:dagitim-yerel@postgres:5432/dagitim?schema=public
      AUTH_SECRET: yerel-deneme-icin-gizli-anahtar-0123456789abcdef
      COOKIE_SECURE: "0"
      STORAGE_DIR: /data/storage
      SEED_DEMO: "1"
      ODA_ADI: Ticaret Odası (Deneme)
      SMS_SAGLAYICI: sahte
      GEOCODE_SAGLAYICI: sahte
      CRON_KEY: yerel-cron
    ports:
      - "3000:3000"
    volumes:
      - storage:/data/storage

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dagitim:dagitim-yerel@postgres:5432/dagitim
      AUTH_SECRET: yerel-deneme-icin-gizli-anahtar-0123456789abcdef
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
    ports:
      - "3001:3001"

  kurye:
    build:
      context: .
      dockerfile: apps/kurye/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
        VITE_REALTIME_URL: http://localhost:3001
    ports:
      - "5173:80"

  # Dakikada bir: SMS kuyruğu (sahte), konum tahmini, bakım
  cron:
    image: node:22-alpine
    depends_on: [web]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 30
        while true; do wget -q -T 300 -O /dev/null "http://web:3000/api/cron/bakim?key=yerel-cron" || true; sleep 60; done

volumes:
  pgdata:
  storage:
